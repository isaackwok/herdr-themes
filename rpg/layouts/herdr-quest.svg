  <!-- roads -->
  <rect x="12" y="44" width="296" height="10" fill="#d9b77a"/>
  <rect x="158" y="54" width="10" height="106" fill="#d9b77a"/>
  <!-- heroes (agents) with status bubbles -->
  <rect x="30" y="58" width="8" height="12" fill="#e8923a"/><rect x="31" y="54" width="6" height="4" fill="#f4f4ff"/><rect x="32" y="50" width="4" height="3" fill="#5ee08a"/>
  <rect x="104" y="58" width="8" height="12" fill="#e8923a"/><rect x="105" y="54" width="6" height="4" fill="#f4f4ff"/><rect x="106" y="50" width="4" height="3" fill="#ff5c6c"/>
