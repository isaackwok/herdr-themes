  <rect x="140" y="96" width="8" height="10" fill="#2f5fd0"/><rect x="141" y="92" width="6" height="4" fill="#6b3d1c"/>
  <!-- plaza: lectern, board, sign, chest, well, fire -->
  <rect x="88" y="132" width="10" height="7" fill="#f4f4ff"/><rect x="92" y="139" width="2" height="6" fill="#b07a3a"/>
  <rect x="112" y="128" width="12" height="11" fill="#b07a3a"/><rect x="114" y="130" width="4" height="3" fill="#f4f4ff"/><rect x="119" y="134" width="4" height="3" fill="#f4f4ff"/>
  <rect x="136" y="146" width="10" height="5" fill="#b07a3a"/><rect x="140" y="151" width="2" height="5" fill="#7a4a24"/>
  <rect x="182" y="132" width="12" height="9" fill="#b07a3a"/><rect x="186" y="135" width="4" height="3" fill="#ffd34e"/>
  <rect x="206" y="128" width="12" height="4" fill="#c8423a"/><rect x="206" y="134" width="12" height="7" fill="#9aa0b8"/><rect x="208" y="135" width="8" height="3" fill="#2f6fd6"/>
  <rect x="232" y="138" width="10" height="3" fill="#7a4a24"/><rect x="234" y="130" width="6" height="8" fill="#ff7a3a"/><rect x="236" y="127" width="2" height="4" fill="#ffd34e"/>
