<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges">
  <rect width="320" height="200" fill="#3fa34d"/>
  <!-- tree border -->
  <g fill="#1f7a3a">
    <rect x="0" y="0" width="320" height="12"/>
    <rect x="0" y="160" width="320" height="12"/>
    <rect x="0" y="0" width="12" height="172"/>
    <rect x="308" y="0" width="12" height="172"/>
  </g>
  <g fill="#7a4a24">
    <rect x="5" y="8" width="2" height="4"/><rect x="25" y="8" width="2" height="4"/><rect x="45" y="8" width="2" height="4"/><rect x="65" y="8" width="2" height="4"/>
  </g>
  <!-- houses -->
  <g>
    <rect x="26" y="18" width="28" height="10" fill="#c8423a"/><rect x="28" y="28" width="24" height="14" fill="#f0e0b8"/><rect x="32" y="32" width="6" height="10" fill="#6b3d1c"/><rect x="42" y="31" width="7" height="5" fill="#ffe58a"/>
    <rect x="100" y="18" width="28" height="10" fill="#c8423a"/><rect x="102" y="28" width="24" height="14" fill="#f0e0b8"/><rect x="106" y="32" width="6" height="10" fill="#6b3d1c"/><rect x="116" y="31" width="7" height="5" fill="#ffe58a"/>
    <rect x="174" y="18" width="28" height="10" fill="#c8423a"/><rect x="176" y="28" width="24" height="14" fill="#f0e0b8"/><rect x="180" y="32" width="6" height="10" fill="#6b3d1c"/><rect x="190" y="31" width="7" height="5" fill="#ffe58a"/>
