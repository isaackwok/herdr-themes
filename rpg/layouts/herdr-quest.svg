  <rect x="4" y="174" width="312" height="22" rx="2" fill="#18218a" stroke="#dfe4ff"/>
  <rect x="10" y="179" width="4" height="4" fill="#ffd34e"/><rect x="18" y="179" width="110" height="4" fill="#f2f4ff"/>
